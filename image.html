<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .image-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            text-align: center;
        }
        .image-container img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        .image-container .title {
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            color: #333;
        }
        .image-container .description {
            padding: 15px;
            text-align: center;
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
        }
        .ai-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            width: 100%;
            max-width: 800px;
        }
        .ai-section .section-title {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
        }
        .ai-description {
            font-size: 0.95rem;
            color: #444;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .generate-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        .generate-btn:hover {
            background-color: #218838;
        }
        .generate-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .loading {
            color: #6c757d;
            font-style: italic;
            margin-top: 10px;
        }
        .back-link {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        .back-link:hover {
            background-color: #0056b3;
        }
        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
        .api-info {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="title" id="image-title">Image</div>
        <img id="display-image" src="" alt="">
        <div class="description" id="image-description"></div>
    </div>
    
    <div class="ai-section">
        <div class="section-title">AI Description</div>
        <div class="input-section">
            <button id="generate-btn" class="generate-btn">Generate AI Description</button>
            <div id="loading" class="loading" style="display: none;">Generating...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div class="api-info">Uses GROQ_API_KEY from Replit Secrets via server proxy</div>
        </div>
        <div id="ai-description" class="ai-description"></div>
    </div>
    
    <a href="index.html" class="back-link">Back to Gallery</a>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const imageName = urlParams.get('name');
            const imageElement = document.getElementById('display-image');
            const titleElement = document.getElementById('image-title');
            const descriptionElement = document.getElementById('image-description');
            const aiDescriptionElement = document.getElementById('ai-description');
            const generateBtn = document.getElementById('generate-btn');
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');

            if (imageName) {
                imageElement.src = getImageUrl(imageName);
                imageElement.alt = imageName;
                titleElement.textContent = imageName.replace(/_/g, ' ').replace(/\.jpg$/i, '');
                descriptionElement.textContent = getStaticDescription(imageName);
            }

            generateBtn.addEventListener('click', async function() {
                if (!imageName) {
                    showError('No image selected');
                    return;
                }

                loadingElement.style.display = 'block';
                aiDescriptionElement.textContent = '';
                errorElement.style.display = 'none';
                generateBtn.disabled = true;

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000);
                    
                    const response = await fetch('/api/generate-description', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            imageName: imageName
                        }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'API request failed');
                    }
                    
                    const data = await response.json();
                    aiDescriptionElement.textContent = data.description;
                    
                } catch (error) {
                    clearTimeout(timeoutId);
                    showError(error.message);
                } finally {
                    loadingElement.style.display = 'none';
                    generateBtn.disabled = false;
                }
            });

            function showError(message) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }

            function getImageUrl(filename) {
                const imageMap = {
                    'hollow_knight_silksong.jpg': 'https://upload.wikimedia.org/wikipedia/en/d/de/Hollow_Knight_2026_cover_art.jpg',
                    'hollow_knight_character.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ5k6jZ7LfrKBMa8Wobt_KSN97QQth7eCnk1g3c9moEaDM4kM06_4CaKGh2&s=10',
                    'hollow_knight_gameplay.jpg': 'https://assets1.ignimgs.com/2018/06/21/hollowknight-1280-1529623462572_160w.jpg?width=1280&format=jpg&auto=webp&quality=80',
                    'dead_cells_cover.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyvbQgfn_JAg2lNjIOZC5AXtLekQw-t0riyM6_G11Uug&s',
                    'dead_cells_green.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUBUwHEmiqTZyNywOFr6pdmHhE-pg2lnSVNgjjHzEFZg&s=10',
                    'dead_cells_boss.jpg': 'https://i.guim.co.uk/img/media/b5285e0659348c1c79ede25248cb945fba8112b5/52_153_1545_927/master/1545.jpg?width=1200&height=900&quality=85&auto=format&fit=crop&s=a89a428b0618a580071544abf0edb239',
                    'noita_screenshot.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcJIYXvTW-lXGADxJTWWjzDIlXNWrZnqjVMh7hWN1nJg&s',
                    'noita_magic.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDzNt_6yQ4tbY7Em1vJI6mIm3F7oVMO4X7nbkGKxG0QF4c4bSIHSpSZ0M&s=10',
                    'noita_world.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlM_u3yMflhnfq-vPmbqNSCV2mGnMlqEvkKWHZAo6Kci0zTwMpJkJPDMgy&s=10'
                };
                return imageMap[filename] || '';
            }

            function getStaticDescription(filename) {
                if (!filename) return '';
                const baseName = filename.replace(/\.jpg$/i, '');
                const descriptions = {
                    'hollow_knight_silksong': 'The upcoming sequel featuring Hornet as the protagonist.',
                    'hollow_knight_character': 'The silent protagonist exploring Hallownest.',
                    'hollow_knight_gameplay': 'Battling through the depths of Hallownest.',
                    'dead_cells_cover': 'A roguelike Metroidvania with fast-paced combat and permadeath.',
                    'dead_cells_green': 'Exploring the toxic sewers biome.',
                    'dead_cells_boss': 'Facing off against a powerful boss enemy.',
                    'noita_screenshot': 'A physics-based roguelike where every pixel is simulated.',
                    'noita_magic': 'Casting powerful spells in the pixel world.',
                    'noita_world': 'Exploring the procedurally generated world.'
                };
                return descriptions[baseName] || '';
            }
        });
    </script>
</body>
</html>
