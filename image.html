<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .image-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            text-align: center;
        }
        .image-container img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        .image-container .title {
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            color: #333;
        }
        .image-container .description {
            padding: 15px;
            text-align: center;
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
        }
        .ai-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            width: 100%;
            max-width: 800px;
        }
        .ai-section .section-title {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
        }
        .ai-description {
            font-size: 0.95rem;
            color: #444;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .generate-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        .generate-btn:hover {
            background-color: #218838;
        }
        .generate-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .loading {
            color: #6c757d;
            font-style: italic;
            margin-top: 10px;
        }
        .back-link {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        .back-link:hover {
            background-color: #0056b3;
        }
        .input-section {
            margin-top: 15px;
            text-align: center;
        }
        .api-input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }
        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="title" id="image-title">Image</div>
        <img id="display-image" src="" alt="">
        <div class="description" id="image-description"></div>
    </div>
    
    <div class="ai-section">
        <div class="section-title">AI Description</div>
        <div class="input-section">
            <input type="password" id="api-key-input" class="api-input" placeholder="Enter Groq API key">
            <button id="generate-btn" class="generate-btn">Generate AI Description</button>
            <div id="loading" class="loading" style="display: none;">Generating...</div>
            <div id="error" class="error" style="display: none;"></div>
        </div>
        <div id="ai-description" class="ai-description"></div>
    </div>
    
    <a href="index.html" class="back-link">Back to Gallery</a>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const imageName = urlParams.get('name');
            const imageElement = document.getElementById('display-image');
            const titleElement = document.getElementById('image-title');
            const descriptionElement = document.getElementById('image-description');
            const aiDescriptionElement = document.getElementById('ai-description');
            const apiKeyInput = document.getElementById('api-key-input');
            const generateBtn = document.getElementById('generate-btn');
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');

            if (imageName) {
                imageElement.src = 'images/' + encodeURIComponent(imageName);
                imageElement.alt = imageName;
                titleElement.textContent = imageName.replace(/_/g, ' ').replace(/\.(jpg|svg)$/i, '');
                descriptionElement.textContent = getStaticDescription(imageName);
            }

            generateBtn.addEventListener('click', async function() {
                const apiKey = apiKeyInput.value.trim();
                if (!apiKey) {
                    showError('Please enter a Groq API key');
                    return;
                }

                loadingElement.style.display = 'block';
                aiDescriptionElement.textContent = '';
                errorElement.style.display = 'none';
                generateBtn.disabled = true;

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000);
                    
                    const description = await generateAIDescription(apiKey, imageName, controller);
                    clearTimeout(timeoutId);
                    
                    aiDescriptionElement.textContent = description;
                    localStorage.setItem('groqApiKey', apiKey);
                } catch (error) {
                    clearTimeout(timeoutId);
                    showError(error.message);
                } finally {
                    loadingElement.style.display = 'none';
                    generateBtn.disabled = false;
                }
            });

            const savedKey = localStorage.getItem('groqApiKey');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }

            function showError(message) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }

            function getStaticDescription(filename) {
                if (!filename) return '';
                const baseName = filename.replace(/\.(jpg|svg)$/i, '');
                const descriptions = {
                    'portrait': 'A black and white portrait photograph of a person.',
                    'nature_leaf': 'A close-up of a green plant leaf with water droplets.',
                    'hot_air_balloons': 'Colorful hot air balloons floating in the sky.',
                    'coastal_rocks': 'Dramatic rocky coastline with ocean waves crashing.',
                    'tropical_beach': 'A serene tropical beach with palm trees and turquoise water.',
                    'mountain_view': 'Breathtaking mountain landscape with snow-capped peaks.',
                    'city_skyline': 'Modern city skyline at dusk with illuminated buildings.',
                    'forest_path': 'A peaceful path through a dense green forest.',
                    'desert_landscape': 'Vast desert with sand dunes under a clear blue sky.'
                };
                return descriptions[baseName] || '';
            }

            async function generateAIDescription(apiKey, imageName, controller) {
                if (!imageName) {
                    throw new Error('No image selected');
                }

                const baseName = imageName.replace(/\.(jpg|svg)$/i, '');
                const imageTitle = baseName.replace(/_/g, ' ');
                const prompt = `Describe the image titled "${imageTitle}" in a creative and detailed way. Focus on what the image might contain based on its title. Provide a 2-3 sentence description.`;

                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama3-8b-8192',
                        messages: [
                            {
                                role: 'user',
                                content: prompt
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 150
                    }),
                    signal: controller.signal
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMsg = errorData.error?.message || response.statusText;
                    throw new Error('API request failed: ' + errorMsg);
                }

                const data = await response.json();
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error('Invalid API response format');
                }
                return data.choices[0].message.content;
            }
        });
    </script>
</body>
</html>
