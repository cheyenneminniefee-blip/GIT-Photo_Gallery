<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .image-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            text-align: center;
        }
        .image-container img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        .image-container .title {
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            color: #333;
        }
        .image-container .description {
            padding: 15px;
            text-align: center;
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
        }
        .ai-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            width: 100%;
            max-width: 800px;
        }
        .ai-section .section-title {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
        }
        .ai-description {
            font-size: 0.95rem;
            color: #444;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .generate-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        .generate-btn:hover {
            background-color: #218838;
        }
        .generate-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .loading {
            color: #6c757d;
            font-style: italic;
            margin-top: 10px;
        }
        .back-link {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        .back-link:hover {
            background-color: #0056b3;
        }
        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
        .api-info {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="title" id="image-title">Image</div>
        <img id="display-image" src="" alt="">
        <div class="description" id="image-description"></div>
    </div>
    
    <div class="ai-section">
        <div class="section-title">AI Description</div>
        <div class="input-section">
            <button id="generate-btn" class="generate-btn">Generate AI Description</button>
            <div id="loading" class="loading" style="display: none;">Generating...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div class="api-info">Uses GROQ_API_KEY from Replit Secrets via server proxy</div>
        </div>
        <div id="ai-description" class="ai-description"></div>
    </div>

    <div class="ai-section">
        <div class="section-title">Animate with Runway ML</div>
        <div class="input-section">
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="animation-prompt" placeholder="Describe what you want to happen..."
                       style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" />
                <button id="animate-btn" class="generate-btn">Animate</button>
            </div>
            <div id="animation-loading" class="loading" style="display: none;">Generating animation...</div>
            <div id="animation-error" class="error" style="display: none;"></div>
            <div class="api-info">Uses RUNWAY_API_KEY from Replit Secrets via server proxy</div>
        </div>
        <div id="animation-results" style="margin-top: 15px; display: none;">
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button id="show-original" class="generate-btn" style="background-color: #6c757d;">Original</button>
                <button id="show-animated" class="generate-btn">Animated</button>
            </div>
            <video id="animation-video" controls style="max-width: 100%; border-radius: 8px; display: none;"></video>
            <img id="display-image-original" style="max-width: 100%; border-radius: 8px; display: none;"></img>
        </div>
    </div>
    
    <a href="index.html" class="back-link">Back to Gallery</a>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const imageName = urlParams.get('name');
            const imageUrl = urlParams.get('url');
            const customTitle = urlParams.get('title');
            const isCustom = urlParams.get('custom') === 'true';
            const imageElement = document.getElementById('display-image');
            const titleElement = document.getElementById('image-title');
            const descriptionElement = document.getElementById('image-description');
            const aiDescriptionElement = document.getElementById('ai-description');
            const generateBtn = document.getElementById('generate-btn');
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');

            function getImageTitle(filename) {
                return filename.replace(/\.(jpg|jpeg|png)$/i, '').replace(/_/g, ' ');
            }

            function getImageUrl(filename) {
                const imageMap = {
                    'hollow_knight_silksong.jpg': 'https://upload.wikimedia.org/wikipedia/en/d/de/Hollow_Knight_2026_cover_art.jpg',
                    'hollow_knight_character.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ5k6jZ7LfrKBMa8Wobt_KSN97QQth7eCnk1g3c9moEaDM4kM06_4CaKGh2&s=10',
                    'hollow_knight_gameplay.jpg': 'https://assets1.ignimgs.com/2018/06/21/hollowknight-1280-1529623462572_160w.jpg?width=1280&format=jpg&auto=webp&quality=80',
                    'dead_cells_cover.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyvbQgfn_JAg2lNjIOZC5AXtLekQw-t0riyM6_G11Uug&s',
                    'dead_cells_green.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUBUwHEmiqTZyNywOFr6pdmHhE-pg2lnSVNgjjHzEFZg&s=10',
                    'dead_cells_boss.jpg': 'https://i.guim.co.uk/img/media/b5285e0659348c1c79ede25248cb945fba8112b5/52_153_1545_927/master/1545.jpg?width=1200&height=900&quality=85&auto=format&fit=crop&s=a89a428b0618a580071544abf0edb239',
                    'noita_screenshot.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcJIYXvTW-lXGADxJTWWjzDIlXNWrZnqjVMh7hWN1nJg&s',
                    'noita_magic.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDzNt_6yQ4tbY7Em1vJI6mIm3F7oVMO4X7nbkGKxG0QF4c4bSIHSpSZ0M&s=10',
                    'noita_world.jpg': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlM_u3yMflhnfq-vPmbqNSCV2mGnMlqEvkKWHZAo6Kci0zTwMpJkJPDMgy&s=10'
                };
                return imageMap[filename] || '';
            }

            function getStaticDescription(filename) {
                if (!filename) return '';
                const baseName = filename.replace(/\.(jpg|jpeg|png)$/i, '');
                const descriptions = {
                    'hollow_knight_silksong': 'The upcoming sequel featuring Hornet as the protagonist.',
                    'hollow_knight_character': 'The silent protagonist exploring Hallownest.',
                    'hollow_knight_gameplay': 'Battling through the depths of Hallownest.',
                    'dead_cells_cover': 'A roguelike Metroidvania with fast-paced combat and permadeath.',
                    'dead_cells_green': 'Exploring the toxic sewers biome.',
                    'dead_cells_boss': 'Facing off against a powerful boss enemy.',
                    'noita_screenshot': 'A physics-based roguelike where every pixel is simulated.',
                    'noita_magic': 'Casting powerful spells in the pixel world.',
                    'noita_world': 'Exploring the procedurally generated world.'
                };
                return descriptions[baseName] || '';
            }

            if (imageName) {
                if (isCustom && imageUrl) {
                    imageElement.src = imageUrl;
                    imageElement.alt = customTitle || imageName;
                    titleElement.textContent = customTitle || getImageTitle(imageName);
                    descriptionElement.textContent = 'Custom image';
                } else {
                    imageElement.src = getImageUrl(imageName);
                    imageElement.alt = imageName;
                    const baseName = imageName.replace(/\.(jpg|jpeg|png)$/i, '');
                    titleElement.textContent = baseName.replace(/_/g, ' ');
                    descriptionElement.textContent = getStaticDescription(imageName);
                }
            }

            async function loadSavedDescription() {
                if (!imageName) {
                    aiDescriptionElement.textContent = '';
                    return;
                }
                try {
                    const urlToUse = isCustom && imageUrl ? imageUrl : getImageUrl(imageName);
                    const response = await fetch('/api/get-description?imageName=' + encodeURIComponent(imageName) + '&imageUrl=' + encodeURIComponent(urlToUse));
                    if (response.ok) {
                        const data = await response.json();
                        if (data.description) {
                            aiDescriptionElement.textContent = data.description;
                        }
                    }
                } catch (error) {
                    console.log('No saved description found');
                }
            }

            loadSavedDescription();

            generateBtn.addEventListener('click', async function() {
                if (!imageName) {
                    showError('No image selected');
                    return;
                }

                loadingElement.style.display = 'block';
                errorElement.style.display = 'none';
                generateBtn.disabled = true;

                try {
                    const urlToUse = isCustom && imageUrl ? imageUrl : imageElement.src;
                    const response = await fetch('/api/generate-description', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            imageName: imageName,
                            imageUrl: urlToUse,
                            forceRegenerate: true
                        })
                    });
                    
                    if (!response.ok) {
                        let errorMsg = 'API request failed';
                        try {
                            const errorData = await response.json();
                            errorMsg = errorData.error || errorMsg;
                        } catch (e) {
                            errorMsg = response.statusText || errorMsg;
                        }
                        throw new Error(errorMsg);
                    }
                    
                    const data = await response.json();
                    if (data.description) {
                        aiDescriptionElement.textContent = data.description;
                    } else {
                        throw new Error('No description returned');
                    }
                    
                } catch (error) {
                    showError(error.message);
                } finally {
                    loadingElement.style.display = 'none';
                    generateBtn.disabled = false;
                }
            });

            function showError(message) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }

            // Animation functionality
            const animateBtn = document.getElementById('animate-btn');
            const animationPrompt = document.getElementById('animation-prompt');
            const animationLoading = document.getElementById('animation-loading');
            const animationError = document.getElementById('animation-error');
            const animationResults = document.getElementById('animation-results');
            const animationVideo = document.getElementById('animation-video');
            const displayImageOriginal = document.getElementById('display-image-original');
            const showOriginalBtn = document.getElementById('show-original');
            const showAnimatedBtn = document.getElementById('show-animated');

            let currentView = 'original';
            let currentAnimationUrl = '';

            animateBtn.addEventListener('click', async function() {
                const prompt = animationPrompt.value.trim();
                if (!prompt) {
                    animationError.textContent = 'Please enter a prompt describing what you want to happen';
                    animationError.style.display = 'block';
                    return;
                }

                if (!imageName) {
                    animationError.textContent = 'No image selected';
                    animationError.style.display = 'block';
                    return;
                }

                animationLoading.style.display = 'block';
                animationError.style.display = 'none';
                animateBtn.disabled = true;

                try {
                    const urlToUse = isCustom && imageUrl ? imageUrl : imageElement.src;
                    
                    const startResponse = await fetch('/api/start-animation', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            imageName: imageName,
                            imageUrl: urlToUse,
                            prompt: prompt
                        })
                    });

                    if (!startResponse.ok) {
                        const errorData = await startResponse.json();
                        throw new Error(errorData.error || 'Failed to start animation');
                    }

                    const startData = await startResponse.json();

                    if (startData.status === 'processing') {
                        const checkResponse = await fetch(`/api/check-animation?imageName=${encodeURIComponent(imageName)}&prompt=${encodeURIComponent(prompt)}`);
                        
                        if (!checkResponse.ok) {
                            const errorData = await checkResponse.json();
                            throw new Error(errorData.error || 'Failed to check animation status');
                        }

                        const checkData = await checkResponse.json();

                        if (checkData.status === 'completed') {
                            currentAnimationUrl = checkData.videoUrl;
                            animationVideo.src = currentAnimationUrl;
                            animationResults.style.display = 'block';
                            animationLoading.style.display = 'none';
                            animateBtn.disabled = false;
                            showAnimated();
                        } else if (checkData.status === 'processing') {
                            animationLoading.textContent = 'Animation is being processed. Please wait and refresh the page.';
                            setTimeout(() => {
                                animationLoading.style.display = 'none';
                                animateBtn.disabled = false;
                            }, 3000);
                        } else {
                            throw new Error(checkData.error || 'Animation processing failed');
                        }
                    } else if (startData.status === 'completed') {
                        currentAnimationUrl = startData.videoUrl;
                        animationVideo.src = currentAnimationUrl;
                        animationResults.style.display = 'block';
                        animationLoading.style.display = 'none';
                        animateBtn.disabled = false;
                        showAnimated();
                    }

                } catch (error) {
                    animationLoading.style.display = 'none';
                    animationError.textContent = error.message;
                    animationError.style.display = 'block';
                    animateBtn.disabled = false;
                }
            });

            showOriginalBtn.addEventListener('click', showOriginal);
            showAnimatedBtn.addEventListener('click', showAnimated);

            function showOriginal() {
                currentView = 'original';
                displayImageOriginal.src = imageElement.src;
                displayImageOriginal.style.display = 'block';
                animationVideo.style.display = 'none';
                showOriginalBtn.style.backgroundColor = '#6c757d';
                showAnimatedBtn.style.backgroundColor = '#28a745';
            }

            function showAnimated() {
                currentView = 'animated';
                displayImageOriginal.style.display = 'none';
                animationVideo.style.display = 'block';
                showOriginalBtn.style.backgroundColor = '#28a745';
                showAnimatedBtn.style.backgroundColor = '#6c757d';
            }

            async function loadSavedAnimation() {
                if (!imageName) return;

                try {
                    const response = await fetch(`/api/get-animation?imageName=${encodeURIComponent(imageName)}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.animations && Object.keys(data.animations).length > 0) {
                            const firstPrompt = Object.keys(data.animations)[0];
                            currentAnimationUrl = data.animations[firstPrompt];
                            animationPrompt.value = firstPrompt;
                            animationVideo.src = currentAnimationUrl;
                            animationResults.style.display = 'block';
                        }
                    }
                } catch (error) {
                    console.log('No saved animations found');
                }
            }

            loadSavedAnimation();

            function showAnimationError(message) {
                animationError.textContent = message;
                animationError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
